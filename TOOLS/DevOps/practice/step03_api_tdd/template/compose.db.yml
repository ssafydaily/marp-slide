# 개발용 PostgreSQL 컨테이너 (Step 1 ~ 5에서 사용)
#   실행: docker compose -f compose.db.yml up -d
#   상태: docker compose -f compose.db.yml ps   (STATUS 가 healthy 이면 준비 완료)
#   종료: docker compose -f compose.db.yml down      (데이터 유지)
#   초기화: docker compose -f compose.db.yml down -v (데이터 삭제)
name: todo-api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
