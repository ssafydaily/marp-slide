# 로컬 Docker 실행 환경
#   전체 실행 : docker compose up -d --build
#   테스트    : docker compose --profile test run --rm test
name: todo-api

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-todo_db}
  POSTGRES_USER: ${POSTGRES_USER:-todo_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_password}

services:
  db:
    image: postgres:16-alpine
    environment:
      <<: *db-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO 7: web 서비스를 작성하세요.
  #   - build: context ".", target "runtime"
  #   - environment: *db-env + POSTGRES_HOST=db, POSTGRES_PORT="5432",
  #                  DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
  #   - ports: "8000:8000"
  #   - depends_on: db 가 healthy 일 때 시작 (condition: service_healthy)
  #   - healthcheck: http://localhost:8000/health/ 호출

  # TODO 8: test 서비스를 작성하세요.
  #   - build target "test", profiles: ["test"]
  #   - RUN_MIGRATIONS: "false"  (pytest 가 테스트 DB 를 직접 만든다)

volumes:
  pgdata:
