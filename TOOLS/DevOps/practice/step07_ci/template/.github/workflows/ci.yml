# CI: main 브랜치 push / PR 마다 "린트 → 테스트 → 도커 빌드" 를 자동 실행
name: CI

# TODO 1: main 브랜치에 push 되거나 main 으로 PR 이 열릴 때 실행되도록 설정하세요.
on:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # TODO 2: ruff 를 설치하고 `ruff check .` 와 `ruff format --check .` 를 실행하세요.

  test:
    name: Test (pytest + PostgreSQL)
    # TODO 3: lint 가 성공해야 실행되도록 의존 관계를 설정하세요. (needs)
    runs-on: ubuntu-latest

    # TODO 4: PostgreSQL 서비스 컨테이너를 추가하세요.
    #   - image: postgres:16-alpine
    #   - env: POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    #   - ports: 5432:5432
    #   - options: --health-cmd "pg_isready ..." (DB 가 준비될 때까지 대기)

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # TODO 5: requirements-dev.txt 를 설치하세요.

      # TODO 6: 마이그레이션 누락 검사
      #   python manage.py makemigrations --check --dry-run

      # TODO 7: 커버리지와 함께 pytest 실행
      #   pytest --cov --cov-report=term-missing --cov-report=xml

      # TODO 8: coverage.xml 을 artifact 로 업로드 (actions/upload-artifact@v4)

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # TODO 9: docker/build-push-action@v6 로 runtime 이미지를 빌드하세요. (push: false)
