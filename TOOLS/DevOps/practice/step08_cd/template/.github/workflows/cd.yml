# CD: CI 가 main 에서 성공하면 → 이미지 빌드 & GHCR push → EC2 에 SSH 배포
name: CD

on:
  # TODO 1: "CI" 워크플로가 main 브랜치에서 완료(completed)되면 실행되도록 설정하세요. (workflow_run)
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # CI 를 통과한 바로 그 커밋으로 배포한다
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build & Push image
    # TODO 2: 수동 실행이거나 CI 가 success 일 때만 실행되도록 if 조건을 작성하세요.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: 이미지 이름 결정 (GHCR 은 소문자만 허용)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # TODO 3: docker/login-action@v3 로 ghcr.io 에 로그인하세요.
      #   username: ${{ github.actor }} / password: ${{ secrets.GITHUB_TOKEN }}

      # TODO 4: docker/build-push-action@v6 로 runtime 이미지를 빌드 & push 하세요.
      #   tags: <image>:latest 와 <image>:<DEPLOY_SHA> 두 개

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      SSH_TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: SSH 키 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # TODO 5: scp 로 deploy/ 폴더의 파일들을 서버 ~/todo-api/ 로 복사하세요.
      #   (docker-compose.prod.yml, nginx.conf, deploy.sh, rollback.sh)

      # TODO 6: ssh 로 접속해 deploy.sh 를 실행하세요.
      #   전달할 환경변수: GHCR_USER, GHCR_TOKEN, IMAGE, IMAGE_TAG(=DEPLOY_SHA)
