# CI: main 브랜치 push / PR 마다 "린트 → 테스트 → 도커 빌드" 를 자동 실행
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소 (러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install "ruff>=0.8"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    name: Test (pytest + PostgreSQL)
    needs: lint
    runs-on: ubuntu-latest

    # 테스트 동안만 사용하는 PostgreSQL 컨테이너
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todo_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_password
        ports:
          - 5432:5432
        # DB 가 준비(healthy)될 때까지 다음 step 을 시작하지 않는다
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (push 하지 않음)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: todo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
