# 운영 서버(EC2)용 compose 파일 — 서버의 ~/todo-api/ 에 위치
#   값은 같은 폴더의 .env 에서 읽는다 (.env.prod.example 참고)
name: todo-api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 를 .env 에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    # 운영 DB 포트는 외부에 공개하지 않는다 (ports 없음)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO 1: web 서비스를 작성하세요.
  #   - image: ${IMAGE}:${IMAGE_TAG}   (값은 .env 에서 읽음)
  #   - restart: unless-stopped / env_file: .env
  #   - environment: DJANGO_SETTINGS_MODULE, POSTGRES_HOST=db, POSTGRES_PORT="5432"
  #   - expose: 8000 (외부 공개 X, nginx 만 접근)
  #   - depends_on db(service_healthy), healthcheck(/health/)

  # TODO 2: nginx 서비스를 작성하세요.
  #   - image: nginx:1.27-alpine, ports "80:80"
  #   - ./nginx.conf 를 /etc/nginx/conf.d/default.conf 로 마운트 (읽기 전용)
  #   - web 이 healthy 가 된 후 시작

volumes:
  pgdata:
